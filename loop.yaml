# Sessions each round advances by one generation. Edit only while no round is
# open (`python -m esm_harness loop-state` exits 0).
branch: cursor/hf-harness-66dd
# true: round begin refuses to start, so scheduled round agents exit without
# changing anything. A round already open still finishes normally.
# Stays true until the round agents' environment has the ESM_CLUSTER_PASSWORD
# secret; without it round begin stops before any model call.
paused: true
rounds_dir: trajectories/rounds
sessions:
  # Acceptance on the cluster's water clusters and straight-chain alkanes:
  # every program must be within 1e-8 Hartree of PySCF (hf.py where PySCF has
  # no result) on every molecule, evaluated as TI-ONE tasks on the cluster.
  - config: configs/hf_rijcosx_cluster.yaml
    run_id: hf-opus55-cluster
  # Uncomment to advance the ablation cells in the same rounds; give the grid a
  # new out_dir first so the recorded cells under trajectories/ablation stay intact.
  # - grid: ablations/hf_rhf.yaml
