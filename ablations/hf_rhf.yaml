# One-factor-at-a-time ablation around the main configuration. Every cell gets
# the same generation budget and starts from nothing.
out_dir: trajectories/ablation
base:
  task: hf_rhf
  max_generations: 4
  submit: local
  suite: benchmarks/hf_rhf.yaml
  references: benchmarks/reference_energies.json
  baseline: baselines/pyscf_rhf.py
  repeats: 3
  timeout_s: 120
  memory_mb: 8192
  factors:
    model: claude-opus-5.5
    prompt_id: hf_minimal
    search: iterative
    speed_weight: 0.5
    reasoning_effort: high
    population_n: 3
    allowed_imports:
      - numpy
      - scipy
      - pyscf.gto
    max_abs_err: 1.0e-8
    max_time_ratio: 1.0
    fitness_err_ceiling: 1.0e-6
cells:
  - {}
  - {prompt_id: hf_spec}
  - {prompt_id: hf_show_baseline}
  - {search: best_of_n}
  - {speed_weight: 0.0}
  - {speed_weight: 2.0}
  - {reasoning_effort: medium}
  - {reasoning_effort: max}
